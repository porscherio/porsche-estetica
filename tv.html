<!--
  Estetica PWA - TV Dashboard
  Versao: 1.0.0
  Atualizado: 13/08/2026 - 02:12 BRT
  Le action=esteticaTV do backend do PWA. Refresh a cada 15 min.
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estetica - TV Dashboard</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;
       font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
       -webkit-font-smoothing:antialiased}

  #stage{width:1920px;height:1080px;transform-origin:top left;
         position:absolute;top:0;left:0;background:#000;
         display:flex;flex-direction:column;padding:28px 34px 20px}

  .hdr{display:flex;align-items:center;justify-content:space-between;
       border-bottom:2px solid #2e2e2e;padding-bottom:16px;flex:none}
  .brand{display:flex;align-items:center;gap:22px}
  .brand h1{font-size:44px;font-weight:400;color:#fff;letter-spacing:4px}
  .sep{color:#3a3a3a;font-size:34px}
  .b-por{color:#fff;font-size:44px;font-weight:600;letter-spacing:1.5px}
  .b-nev{color:#9a8cff;font-size:44px;font-weight:600;letter-spacing:1.5px}
  .meta{display:flex;align-items:center;gap:34px}
  .kpi{text-align:right}
  .kpi .lab{color:#6e6e6e;font-size:15px;letter-spacing:1px}
  .kpi .val{color:#fff;font-size:30px;font-weight:500;line-height:1.1}
  .kpi .val.warn{color:#c9e600}
  .clock{color:#fff;font-size:40px;font-weight:500;line-height:1}
  .clock small{display:block;color:#6e6e6e;font-size:14px;font-weight:400;letter-spacing:.5px}

  .body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 300px;
        gap:22px;padding-top:20px;min-height:0}

  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
        grid-auto-rows:min-content;gap:16px;min-height:0}

  .card{background:#121212;border:1px solid #2a2a2a;border-radius:14px;padding:16px 18px}
  .card .top{display:flex;justify-content:space-between;align-items:baseline}
  .ro{color:#fff;font-size:38px;font-weight:500;line-height:1;letter-spacing:1px}
  .veh{color:#8a8a8a;font-size:17px;text-align:right;line-height:1.3}
  .veh b{display:block;color:#b5b5b5;font-weight:500}

  .eta{margin:12px 0 10px;border-radius:8px;padding:7px 12px}
  .eta .lab{font-size:13px;letter-spacing:1.5px}
  .eta .val{font-size:23px;font-weight:500;line-height:1.2}
  .eta.ok{background:#0b2a1f}    .eta.ok .lab{color:#5DCAA5}   .eta.ok .val{color:#9FE1CB}
  .eta.late{background:#2a0f0f}  .eta.late .lab{color:#F09595} .eta.late .val{color:#F7C1C1}
  .eta.none{background:#242a05}  .eta.none .lab{color:#c9e600} .eta.none .val{color:#e4f78a}

  .pill{display:inline-block;font-size:18px;font-weight:600;padding:4px 16px;
        border-radius:16px;margin-bottom:10px;letter-spacing:.5px}
  .pill.ok{background:#0F6E56;color:#E1F5EE}
  .pill.late{background:#A32D2D;color:#FCEBEB}
  .pill.none{background:#9EFF00;color:#173404}
  .pill.idle{background:transparent;color:#5a5a5a;font-weight:400;padding-left:0}

  .jl{display:flex;align-items:center;gap:10px;margin-top:6px}
  .jl .d{flex:1;color:#c8c8c8;font-size:17px;overflow:hidden;
         text-overflow:ellipsis;white-space:nowrap}
  .jl .pc{color:#8a8a8a;font-size:15px;width:44px;text-align:right}
  .bar{width:74px;height:7px;background:#262626;border-radius:4px;overflow:hidden;flex:none}
  .bar i{display:block;height:100%;background:#5DCAA5}
  .bar i.r{background:#E24B4A}
  .bar i.y{background:#9EFF00}

  .techs{display:flex;flex-direction:column;gap:14px;min-width:0}
  .techs h2{color:#6e6e6e;font-size:15px;letter-spacing:2px;font-weight:400}
  .tech{background:#121212;border:1px solid #2a2a2a;border-radius:14px;padding:13px 15px}
  .tech .n{display:flex;justify-content:space-between;align-items:center}
  .tech .n span{color:#fff;font-size:23px;font-weight:500}
  .dot{width:15px;height:15px;border-radius:50%;flex:none}
  .dot.ok{background:#5DCAA5} .dot.late{background:#E24B4A} .dot.none{background:#9EFF00}
  .tech .w{color:#8a8a8a;font-size:17px;margin-top:5px}
  .tech .w b{color:#c8c8c8;font-weight:500}

  .foot{flex:none;border-top:1px solid #1e1e1e;padding-top:12px;
        display:flex;align-items:center;justify-content:space-between}
  .leg{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
  .leg div{display:flex;align-items:center;gap:9px;color:#7a7a7a;font-size:15px}
  .sw{width:15px;height:15px;border-radius:50%;flex:none}
  .sw.ok{background:#5DCAA5} .sw.late{background:#E24B4A} .sw.none{background:#9EFF00}
  .sw.bar{width:26px;height:7px;border-radius:4px;background:#5DCAA5}
  .cr{color:#5a5a5a;font-size:15px;white-space:nowrap}

  @keyframes bk{0%,45%{opacity:1}55%,100%{opacity:.22}}
  .bk{animation:bk 1.6s steps(1,end) infinite}
  @media (prefers-reduced-motion:reduce){.bk{animation:none}}
</style>
</head>
<body>
<div id="stage">

  <div class="hdr">
    <div class="brand">
      <h1>ESTETICA</h1>
      <span class="sep">|</span>
      <span class="b-por">PORSCHE | RJ</span>
      <span class="sep">&middot;</span>
      <span class="b-nev">NEVADA | RJ</span>
    </div>
    <div class="meta">
      <div class="kpi"><div class="lab">ROs</div><div class="val" id="k-ros">--</div></div>
      <div class="kpi"><div class="lab">PPF</div><div class="val" id="k-ppf">--</div></div>
      <div class="kpi"><div class="lab">POLIMENTO</div><div class="val" id="k-pol">--</div></div>
      <div class="kpi"><div class="lab">SEM ENTREGA</div><div class="val warn" id="k-sem">--</div></div>
      <div class="clock" id="k-hora">--:--<small id="k-upd">a carregar</small></div>
    </div>
  </div>

  <div class="body">
    <div class="grid" id="grid"></div>
    <div class="techs">
      <h2>T&Eacute;CNICOS</h2>
      <div id="techs"></div>
    </div>
  </div>

  <div class="foot">
    <div class="leg">
      <div><i class="sw ok"></i> No prazo &mdash; cabe at&eacute; a entrega</div>
      <div><i class="sw late"></i> Atrasado &mdash; horas restantes &gt; horas &uacute;teis</div>
      <div><i class="sw none"></i> Sem entrega agendada</div>
      <div><i class="sw bar"></i> Conclus&atilde;o da jobline</div>
      <div>Pill piscando &mdash; t&eacute;cnico apontado agora</div>
    </div>
    <div class="cr">&copy; Porsche Service Rio 2026</div>
  </div>

</div>

<script>
// URL do web app do PWA (mesmo backend, rota action=esteticaTV).
const API_URL = 'https://script.google.com/macros/s/AKfycbyEXU1XIwlXfVveC56ftTxud5RxNJdVgwJq5F4k4uGsJqqiVNDzTbR1JpaFktfAmshq/exec';
const REFRESH_MS = 15 * 60 * 1000;   // 15 min, conforme pedido

function fit(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  const el = document.getElementById('stage');
  el.style.transform = 'scale('+s+')';
  el.style.left = ((innerWidth - 1920*s)/2)+'px';
  el.style.top  = ((innerHeight - 1080*s)/2)+'px';
}
addEventListener('resize', fit); fit();

const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const DIAS = ['dom','seg','ter','qua','qui','sex','sab'];

function rotuloETA(iso){
  if (!iso) return 'N&atilde;o definido';
  const d = new Date(iso), hoje = new Date();
  const hh = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  if (d.toDateString() === hoje.toDateString()) return 'hoje &middot; ' + hh;
  return DIAS[d.getDay()] + ' ' + String(d.getDate()).padStart(2,'0') + '/' +
         String(d.getMonth()+1).padStart(2,'0') + ' &middot; ' + hh;
}

function classeEstado(e){ return e === 'atrasado' ? 'late' : (e === 'sem_prazo' ? 'none' : 'ok'); }

function barra(pct, cls){
  const w = Math.max(0, Math.min(100, Number(pct) || 0));
  return '<span class="bar"><i class="' + cls + '" style="width:' + w + '%"></i></span>' +
         '<span class="pc">' + Math.round(w) + '%</span>';
}

function cardHTML(ro){
  const cls = classeEstado(ro.estado);
  const barCls = cls === 'late' ? 'r' : (cls === 'none' ? 'y' : '');

  const pill = ro.tech_ativo
    ? '<span class="pill ' + cls + ' bk">' + esc(ro.tech_ativo) + '</span>'
    : '<span class="pill idle">sem apontamento</span>';

  const jls = (ro.joblines || []).map(j =>
    '<div class="jl"><span class="d">' + esc(j.descricao) + '</span>' + barra(j.pct, barCls) + '</div>'
  ).join('');

  // Numeros do estado vermelho: mostrar o quanto nao cabe. Sem isso o
  // vermelho e uma afirmacao sem prova em cima de uma TV.
  const nums = (ro.estado === 'atrasado' && ro.horas_disponiveis !== null)
    ? '<div class="jl" style="color:#F09595">' + ro.horas_restantes + 'h restantes &middot; ' +
      ro.horas_disponiveis + 'h at&eacute; a entrega</div>'
    : '';

  return '<div class="card">' +
    '<div class="top"><span class="ro">' + esc(ro.ro_number) + '</span>' +
    '<span class="veh"><b>' + esc(ro.modelo) + '</b>' + esc(ro.plate) + '</span></div>' +
    '<div class="eta ' + cls + '"><div class="lab">ENTREGA ETA</div>' +
    '<div class="val">' + rotuloETA(ro.entrega_eta) + '</div></div>' +
    pill + nums + jls + '</div>';
}

function techHTML(t){
  const cls = t.ativo ? classeEstado(t.estado) : '';
  const dot = t.ativo
    ? '<i class="dot ' + cls + ' bk"></i>'
    : '<i class="dot" style="background:#3a3a3a"></i>';
  const linha = t.ativo
    ? '<div class="w"><b>RO ' + esc(t.ro) + '</b></div><div class="w">' + esc(t.jobline) + '</div>'
    : '<div class="w" style="color:#5a5a5a">livre</div>';
  return '<div class="tech"><div class="n"><span>' + esc(t.nome) + '</span>' + dot + '</div>' + linha + '</div>';
}

async function carregar(){
  try {
    const res  = await fetch(API_URL + '?action=esteticaTV');
    const data = await res.json();
    if (!data || !data.ok) throw new Error(data && data.error ? data.error : 'resposta invalida');

    const c = data.contadores || {};
    document.getElementById('k-ros').textContent = c.ros || 0;
    document.getElementById('k-ppf').textContent = (data.categorias && data.categorias.PPF) || 0;
    document.getElementById('k-pol').textContent = (data.categorias && data.categorias.POLIMENTO) || 0;
    document.getElementById('k-sem').textContent = c.sem_prazo || 0;

    document.getElementById('grid').innerHTML =
      (data.ros || []).length
        ? data.ros.map(cardHTML).join('')
        : '<div style="color:#5a5a5a;font-size:20px;padding:30px">Nenhuma RO de est&eacute;tica em aberto.</div>';

    document.getElementById('techs').innerHTML = (data.tecnicos || []).map(techHTML).join('');

    const ag = new Date();
    document.getElementById('k-hora').firstChild.textContent =
      String(ag.getHours()).padStart(2,'0') + ':' + String(ag.getMinutes()).padStart(2,'0');
    document.getElementById('k-upd').textContent = 'atualizado agora';
  } catch (e) {
    // Falha de rede nao pode apagar o board: mantem o que esta na tela
    // e avisa no cabecalho que o dado esta velho.
    document.getElementById('k-upd').textContent = 'sem liga&ccedil;&atilde;o &mdash; dado desatualizado';
  }
}

carregar();
setInterval(carregar, REFRESH_MS);
setInterval(() => {
  const ag = new Date();
  document.getElementById('k-hora').firstChild.textContent =
    String(ag.getHours()).padStart(2,'0') + ':' + String(ag.getMinutes()).padStart(2,'0');
}, 30000);
</script>
</body>
</html>
